---

- name: upload sh
  template:
    src: "{{ playbook_dir }}/roles/k8s1175node/templates/vm_check2.sh.j2"
    dest: /tmp/vm_check2.sh
    owner: sysop
    group: users
    mode: "u=rwx,g=rx,o=rx"
  when: ENABLE_VM_CHECK
  tags:
    - always

- name: execute
  shell: "sh /tmp/vm_check2.sh"
  register: vm_check_result2
  when: ENABLE_VM_CHECK
  tags:
    - always
- debug:
    msg: "{{ vm_check_result2.stdout }}"
  when: ENABLE_VM_CHECK
  tags:
    - always
