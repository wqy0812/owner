---
- name: Apply kubelet on k8smaster
  hosts: k8smaster
  gather_facts: false
  become: true
  roles:
    - role: k8s1175_components
      k8s1175_component_task: kubelet

- name: Apply kubelet on k8snode
  hosts: k8snode
  gather_facts: false
  become: true
  roles:
    - role: k8s1175_components
      k8s1175_component_task: kubelet

