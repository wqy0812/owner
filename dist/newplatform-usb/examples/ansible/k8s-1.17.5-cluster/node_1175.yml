---
# This playbook deploys the whole application stack in this site.

- name: install and configure k8snode
  remote_user: sysop
  hosts: k8snode
  gather_facts: false
  max_fail_percentage: 100
  serial: 20

  pre_tasks:
    - import_tasks: preflight_1175.yml
    - import_tasks: docker_runtime_preflight.yml
    - import_tasks: varutil.yml
    - import_tasks: vm_check.yml
    - import_tasks: vm_check2.yml
    - import_tasks: f5_check.yml
  roles:
    - k8s1175node
