---

- name: stop node amc
  shell: ./amc_stop.sh
  ignore_errors: yes
  args:
    chdir: /approot1/paas/node_amc

- name: <k8snode>stop kubelet
  systemd:
    name: kubelet
    state: stopped
  async: 60
  poll: 5
  
- name: <k8snode>stop kube-proxy
  systemd:
    name: kube-proxy
    state: stopped
  async: 60
  poll: 5
  
- name: <k8snode>stop docker
  systemd:
    name: docker
    state: stopped
  async: 60
  poll: 5
  
- name: <k8snode>stop blackbox_exporter
  systemd:
    name: blackbox_exporter
    state: stopped
  async: 60
  poll: 5
