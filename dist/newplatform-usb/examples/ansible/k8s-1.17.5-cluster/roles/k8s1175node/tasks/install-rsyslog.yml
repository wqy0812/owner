
---
# 增加日志滚动压缩
- name: <k8snode>upload logrotate conf of syslog
  tags:
    - install
    - check
    - update
  copy: src=k8slog dest=/etc/logrotate.d/k8slog owner=root group=root mode="u=rw,g=r,o=r" backup=yes

- name: systemctl daemon-reload
  command: systemctl daemon-reload

- name: <k8snode>restart rsyslog
  service: name=rsyslog state=restarted