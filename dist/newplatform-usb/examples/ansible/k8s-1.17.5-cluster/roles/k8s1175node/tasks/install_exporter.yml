---
- name: mkdir /approot1/paas/exporter
  tags:
    - install
    - check
    - update
  file: path=/approot1/paas/exporter state=directory owner=sysop
  
- name: upload service file
  tags:
    - install
    - check
    - update
  copy: src=blackbox_exporter.service dest=/usr/lib/systemd/system/blackbox_exporter.service owner=root group=users mode="u=rw,g=r,o=r" backup=yes
  notify: systemctl daemon-reload
  
- meta: flush_handlers

- name: download blackbox_exporter
  tags:
    - install
    - update
  get_url: 
    url: http://{{ IHS_IP }}:{{ IHS_PORT }}/{{ BLACKBOX_EXPORTER_MEDPATH }}
    dest: /approot1/paas/exporter/blackbox_exporter
    checksum: sha256:{{ BLACKBOX_EXPORTER_SHA256 }}
    owner: sysop
    mode: "u=rwx,g=rx,o=rx"
    
- name: upload blackbox.yml file
  tags:
    - install
    - check
    - update
  copy: src=blackbox.yml dest=/approot1/paas/exporter/blackbox.yml owner=sysop mode="u=rwx,g=rx,o=rx"
  
- name: enable blackbox_exporter service
  tags:
    - install
    - check
    - update
  service: name=blackbox_exporter enabled=yes
    
