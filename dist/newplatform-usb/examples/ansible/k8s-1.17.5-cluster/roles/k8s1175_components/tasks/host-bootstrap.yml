---
- name: Ensure Kubernetes service account exists
  ansible.builtin.user:
    name: kube
    home: /approot1/paas/kube
    group: users
    state: present

- name: Create Kubernetes host directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: kube
    group: users
    mode: '0750'
  loop:
    - /approot1/paas/kube/bin
    - /approot1/paas/kube/conf
    - /approot1/paas/kube/cert
    - /approot1/paas/kube/logs

