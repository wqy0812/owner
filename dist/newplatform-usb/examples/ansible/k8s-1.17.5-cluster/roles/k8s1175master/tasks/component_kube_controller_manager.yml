---
- name: Install kube-controller-manager service unit
  ansible.builtin.copy:
    src: kube-controller-manager.service
    dest: /usr/lib/systemd/system/kube-controller-manager.service
    owner: root
    group: users
    mode: '0644'
    backup: true

- name: Generate kube-controller-manager kubeconfig
  ansible.builtin.template:
    src: init-kube-controller-manager.sh.j2
    dest: /approot1/paas/kube/bin/init-kube-controller-manager.sh
    owner: kube
    group: users
    mode: '0755'

- name: Initialize kube-controller-manager kubeconfig
  ansible.builtin.command: /approot1/paas/kube/bin/init-kube-controller-manager.sh
  changed_when: true

- name: Write kube-controller-manager parameters
  ansible.builtin.template:
    src: controller-manager.j2
    dest: /approot1/paas/kube/conf/controller-manager
    owner: kube
    group: users
    mode: '0644'

- name: Enable and start kube-controller-manager
  ansible.builtin.systemd:
    name: kube-controller-manager
    enabled: true
    state: started
    daemon_reload: true

