  # async: 60
  # poll: 5
  
- name: <k8snode>start docker
  systemd:
    name: docker
    daemon_reload: yes
    state: started
  async: 60
  poll: 5

- name: <k8snode>start kubelet
  systemd:
    name: kubelet
    daemon_reload: yes
    state: started
  async: 60
  poll: 5

- name: <k8snode>start kube-proxy
  systemd:
    name: kube-proxy
    daemon_reload: yes
    state: started
  async: 60
  poll: 5
  
- name: wait for confirm service
  wait_for: timeout=5
  
- name: <k8snode>confirm docker started
  systemd:
    name: docker
    daemon_reload: yes
    state: started
  async: 60
  poll: 5

- name: <k8snode>confirm kubelet started
  systemd:
    name: kubelet
    daemon_reload: yes
    state: started
  async: 60
  poll: 5

- name: <k8snode>confirm kube-proxy started
  systemd:
    name: kube-proxy
    daemon_reload: yes
    state: started
  async: 60
  poll: 5
