---
- name: upload metrics-server config
  tags:
    - install
    - check
    - update
  copy: src=metrics-server dest=/approot1/paas/kube/conf/ owner=kube group=users mode="u=rw,g=r,o=r"

- name: render immutable metrics-server image digests
  tags:
    - install
    - check
    - update
  template:
    src: "{{ role_path }}/files/metrics-server/metrics-server-deployment.yaml"
    dest: /approot1/paas/kube/conf/metrics-server/metrics-server-deployment.yaml
    owner: kube
    group: users
    mode: "u=rw,g=r,o=r"

- name: create metrics-server
  tags:
    - install
    - update
    - check
  shell: "/approot1/paas/kube/bin/kubectl apply -f /approot1/paas/kube/conf/metrics-server/. --kubeconfig=/approot1/paas/kube/cert/kubectl.kubeconfig"
