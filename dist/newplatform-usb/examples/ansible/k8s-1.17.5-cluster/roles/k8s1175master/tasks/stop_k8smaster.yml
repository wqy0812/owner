---

- name: <k8smaster>stop kube-apiserver
  service: name=kube-apiserver state=stopped
  
- name: <k8smaster>stop kube-controller-manager
  service: name=kube-controller-manager state=stopped
  
- name: <k8smaster>stop kube-scheduler
  service: name=kube-scheduler state=stopped
  
- name: <k8smaster>stop blackbox_exporter
  service: name=blackbox_exporter state=stopped
  
