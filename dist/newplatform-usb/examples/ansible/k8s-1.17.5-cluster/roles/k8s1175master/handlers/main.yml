---
# Handler to handle common notifications. Handlers are called by other plays.
# See http://docs.ansible.com/playbooks_intro.html for more information about handlers.

- name: systemctl daemon-reload
  command: systemctl daemon-reload
  
- name: <k8snode>restart flanneld
  systemd:
    name: flanneld
    daemon_reload: yes
    state: restarted
  async: 60
  poll: 5
  
- name: <k8snode>restart systemd-journald
  systemd:
    name: systemd-journald
    daemon_reload: yes
    state: restarted
  async: 60
  poll: 5
  
- name: <k8snode>restart docker
  systemd:
    name: docker
    daemon_reload: yes
    state: restarted
  async: 60
  poll: 5

- name: <k8snode>restart kubelet
  systemd:
    name: kubelet
    daemon_reload: yes
    state: restarted
  async: 60
  poll: 5

- name: <k8snode>restart kube-proxy
  systemd:
    name: kube-proxy
    daemon_reload: yes
    state: restarted
  async: 60
  poll: 5
  
- name: <docker>config docker ssl
  command: /root/ssl/docker_ssl.sh