---
- name: Define component verification probes
  ansible.builtin.set_fact:
    k8s1175_verify_paths:
      host-bootstrap: /approot1/paas/kube
      cluster-pki: /approot1/paas/admin/app/ansible/task/cert
      docker: /usr/lib/systemd/system/docker.service
      etcd: /usr/lib/systemd/system/etcd.service
      kubernetes-distribution: /approot1/paas/kube/bin/kubelet
      kubernetes-encryption-config: /approot1/paas/kube/cert/encryption-config.yaml
      kube-apiserver: /usr/lib/systemd/system/kube-apiserver.service
      kube-controller-manager: /usr/lib/systemd/system/kube-controller-manager.service
      kube-scheduler: /usr/lib/systemd/system/kube-scheduler.service
      flannel: /usr/lib/systemd/system/flanneld.service
      kubelet: /usr/lib/systemd/system/kubelet.service
      kube-proxy: /usr/lib/systemd/system/kube-proxy.service
      node-logging: /etc/logrotate.d/k8slog
      haproxy: /usr/lib/systemd/system/haproxy.service
      blackbox-exporter: /usr/lib/systemd/system/blackbox_exporter.service
      node-exporter: /etc/systemd/system/node-exporter.service
      amc: /approot1/paas/node_amc
      glusterfs-client: /usr/sbin/gluster
      go-pprof-toolkit: /usr/local/go/pkg/tool/linux_amd64/pprof
    k8s1175_verify_services:
      docker: docker
      etcd: etcd
      kube-apiserver: kube-apiserver
      kube-controller-manager: kube-controller-manager
      kube-scheduler: kube-scheduler
      flannel: flanneld
      kubelet: kubelet
      kube-proxy: kube-proxy
      haproxy: haproxy
      blackbox-exporter: blackbox_exporter
      node-exporter: node-exporter
      node-logging: rsyslog
    k8s1175_verify_kubernetes_objects:
      kubernetes-bootstrap-rbac: [/approot1/paas/kube/bin/kubectl, --kubeconfig=/approot1/paas/kube/cert/kubectl.kubeconfig, get, clusterrolebinding, kubelet-bootstrap]
      coredns: [/approot1/paas/kube/bin/kubectl, --kubeconfig=/approot1/paas/kube/cert/kubectl.kubeconfig, -n, kube-system, get, deployment, coredns]
      metrics-server: [/approot1/paas/kube/bin/kubectl, --kubeconfig=/approot1/paas/kube/cert/kubectl.kubeconfig, -n, kube-system, get, deployment, metrics-server-v0.3.1]
      prometheus-access-bootstrap: [/approot1/paas/kube/bin/kubectl, --kubeconfig=/approot1/paas/kube/cert/kubectl.kubeconfig, get, clusterrole, prometheus]
      autoscaling-rbac: [/approot1/paas/kube/bin/kubectl, --kubeconfig=/approot1/paas/kube/cert/kubectl.kubeconfig, get, clusterrole, autoscale-operator]
  changed_when: false

- name: Re-run topology assertions for Host Preflight
  ansible.builtin.assert:
    that:
      - groups['k8smaster'] | default([]) | length >= 1
      - groups['k8snode'] | default([]) | length >= 1
      - groups['k8setcd'] | default([]) | length >= 1
  when: k8s1175_component_task == 'host-preflight'

- name: Probe component filesystem state
  ansible.builtin.stat:
    path: "{{ k8s1175_verify_paths[k8s1175_component_task] }}"
  register: k8s1175_component_probe
  when: k8s1175_component_task in k8s1175_verify_paths

- name: Require the component probe to exist
  ansible.builtin.assert:
    that: k8s1175_component_probe.stat.exists
    fail_msg: "{{ k8s1175_component_task }} verification probe is missing."
  when: k8s1175_component_task in k8s1175_verify_paths

- name: Require component systemd service to be active
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ k8s1175_verify_services[k8s1175_component_task] }}"]
  changed_when: false
  when: k8s1175_component_task in k8s1175_verify_services

- name: Verify the component-specific Kubernetes API object
  ansible.builtin.command:
    argv: "{{ k8s1175_verify_kubernetes_objects[k8s1175_component_task] }}"
  changed_when: false
  when: k8s1175_component_task in k8s1175_verify_kubernetes_objects
