---
- name: Validate required OpenFuyao variables are present
  assert:
    that:
      - lookup('ansible.builtin.vars', item, default=none) is not none
      - lookup('ansible.builtin.vars', item, default='') | string | length > 0
    fail_msg: "Required OpenFuyao variable is missing or empty: {{ item }}"
    quiet: true
  loop: "{{ openfuyao_required_vars | default([]) }}"

- name: Validate OpenFuyao object variables
  assert:
    that:
      - lookup('ansible.builtin.vars', item, default=none) is mapping
    fail_msg: "OpenFuyao variable must be an object: {{ item }}"
    quiet: true
  loop: "{{ openfuyao_object_vars | default([]) }}"

- name: Validate OpenFuyao integer variables
  assert:
    that:
      - lookup('ansible.builtin.vars', item, default=none) is number
    fail_msg: "OpenFuyao variable must be numeric: {{ item }}"
    quiet: true
  loop: "{{ openfuyao_integer_vars | default([]) }}"

- name: Validate target host group
  assert:
    that:
      - target_host_group in groups
      - groups[target_host_group] | length > 0
    fail_msg: "OpenFuyao target host group is absent or empty: {{ target_host_group | default('undefined') }}"
    quiet: true

- name: Validate cluster role
  assert:
    that:
      - cluster_role in ['manager', 'work']
    fail_msg: "OpenFuyao cluster_role must be manager or work"
    quiet: true
  when: openfuyao_validate_cluster_role | default(false) | bool

- name: Validate role-specific target host group
  assert:
    that:
      - cluster_role in openfuyao_allowed_target_groups_by_role
      - target_host_group in openfuyao_allowed_target_groups_by_role[cluster_role]
    fail_msg: "OpenFuyao target_host_group is invalid for cluster_role"
    quiet: true
  when: openfuyao_allowed_target_groups_by_role is defined

- name: Validate role-specific delegate host groups
  assert:
    that:
      - cluster_role in openfuyao_required_delegate_groups_by_role
      - openfuyao_required_delegate_groups_by_role[cluster_role] in groups
      - groups[openfuyao_required_delegate_groups_by_role[cluster_role]] | length > 0
    fail_msg: "OpenFuyao delegate host group is absent or empty for cluster_role"
    quiet: true
  when: openfuyao_required_delegate_groups_by_role is defined

- name: Validate cluster strategy
  assert:
    that:
      - strategy in ['StatefulFlatNetworkStrategy', 'StatelessPortMappingStrategy', 'StatelessFlatNetworkStrategy']
    fail_msg: "OpenFuyao strategy is unsupported"
    quiet: true
  when: openfuyao_validate_strategy | default(false) | bool
