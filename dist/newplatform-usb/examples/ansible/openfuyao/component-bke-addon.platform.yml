---
- name: OpenFuyao addon component
  hosts: "{{ target_host_group }}"
  remote_user: sysop
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - import_tasks: component-bke-contract.tasks.yml
      vars:
        openfuyao_required_vars:
          - target_host_group
          - strategy
          - ENV_FILESTATION_IP
          - ENV_FILESTATION_PORT
          - ENV_DOCKER_HARBOR_DOMAIN
          - chart_museum_url
          - helm_repo_name
          - addon_params
          - ENV_DOCKER_SECRET_USERNAME
          - ENV_DOCKER_SECRET_PASSWORD
          - ENV_CHART_PULL_USERNAME
          - ENV_CHART_PULL_PASSWORD
          - ansible_ssh_pass
        openfuyao_object_vars:
          - addon_params
        openfuyao_integer_vars:
          - ENV_FILESTATION_PORT
        openfuyao_validate_strategy: true
      tags: always
  roles:
    - role: bke-addon
