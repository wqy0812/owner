---
# This playbook deploys the whole application stack in this site.

- name: generate cert
  remote_user: sysop
  gather_facts: no
  hosts: management_cluster_k8smaster
  any_errors_fatal: true
  roles:
    - { role: bke-cert }

- name: install work cluster
  remote_user: sysop
  gather_facts: no
  hosts: work_cluster_k8smaster
  any_errors_fatal: true
  roles:
    - { role: bke-common }
    - { role: bke-addon }
    - { role: bke-master }
