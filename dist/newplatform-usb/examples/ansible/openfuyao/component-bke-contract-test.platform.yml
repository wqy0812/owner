---
- name: Exercise the platform-owned OpenFuyao contract only
  hosts: "{{ target_host_group }}"
  gather_facts: false
  tasks:
    - import_tasks: component-bke-contract.tasks.yml
      vars:
        openfuyao_required_vars:
          - target_host_group
          - cluster_id
          - cluster_role
          - strategy
          - BKE_ADMIN
          - JQ_MEDPATH
          - SSH_KEY_PUB
          - SSH_KNOWN_HOSTS
          - ENV_DOCKER_HARBOR_DOMAIN
          - ENV_DOCKER_HARBOR_IP
          - ENV_DOCKER_HARBOR_PORT
          - ENV_DOCKER_HARBOR_PORJECT
          - ENV_FILESTATION_DOMAIN
          - ENV_FILESTATION_IP
          - ENV_FILESTATION_PORT
          - ENV_FILESTATION_PREFIX
          - ENV_FILESTATION_URL
          - ENV_CHART_REPO_PORT
          - SERVICE_IP_RANGE_IPV4
          - CLUSTER_IP_RANGE_IPV4
          - CLUSTER_IP_RANGE_IPV6
          - CLUSTER_DNS_SVC_IP
          - PORTMAP_HOST_PORT_MIN
          - PORTMAP_HOST_PORT_MAX
          - openFuyao_version
          - kubernetes_version
          - etcd_version
          - containerd_version
          - calico_version
          - coredns_version
          - kubeproxy_version
          - openstack_vlan_version
          - redis_operator_version
          - harbor_secret_version
          - pause_tag
          - cluster_api_version
          - bkeagent_deployer_version
          - bkeagent_deployer_tag
          - IP_MOD_VERSION
          - certOutputPath
          - certOutputFile
          - addon_params
          - ENV_DOCKER_SECRET_USERNAME
          - ENV_DOCKER_SECRET_PASSWORD
          - ansible_ssh_pass
        openfuyao_object_vars:
          - addon_params
        openfuyao_integer_vars:
          - ENV_DOCKER_HARBOR_PORT
          - ENV_FILESTATION_PORT
          - ENV_CHART_REPO_PORT
          - PORTMAP_HOST_PORT_MIN
          - PORTMAP_HOST_PORT_MAX
        openfuyao_validate_cluster_role: true
        openfuyao_validate_strategy: true
        openfuyao_allowed_target_groups_by_role:
          manager:
            - management_cluster_k8smaster
          work:
            - work_cluster_k8smaster
