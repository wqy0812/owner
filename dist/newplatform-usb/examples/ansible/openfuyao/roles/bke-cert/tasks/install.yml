---

- name: Check if KUBERNETES_CLUSTER_IP is undefined or empty
  when: KUBERNETES_CLUSTER_IP is undefined or KUBERNETES_CLUSTER_IP is none or KUBERNETES_CLUSTER_IP | length == 0
  block:
    - import_tasks: roles/SYSTEM/tasks/get_ip_from_cidr.yml
      vars:
        cidr: "{{ SERVICE_IP_RANGE_IPV4 }}"
        diff: 1

    - name: set global facts
      set_fact:
        KUBERNETES_CLUSTER_IP: "{{ ip_from_cidr }}"

- name: Pre-flight check - Validate path variable
  assert:
    that:
      # 1. Must be an absolute path
      - cert_config is match("^/")
      # 2. Path depth must be greater than 1 (prevent deleting root directory /)
      - cert_config.split('/') | length > 2
      # 3. Restrict operations to a specific directory (Whitelist mechanism, very important)
      - cert_config is match("^/etc/openFuyao/certs/")
      # 4. Variable must not be empty
      - cert_config | length > 0
    fail_msg: "Illegal path detected: {{ cert_config }}. Operation aborted."

- name: Display target path
  debug:
    msg: "Target deletion path: {{ cert_config }}"

- name: clear certs
  file:
    path: "{{ cert_config }}"
    state: absent

- name: mkdir cert storage
  file:
    path: '{{ cert_config }}'
    state: directory
    owner: sysop
    mode: "u=rwx,g=rx,o=rx"

- name: copy cert files
  copy:
    src: '{{ item }}'
    dest: '{{ cert_config }}/{{ item }}'
    owner: sysop
    mode: "u=rw,g=r,o=r"
  loop:
    - admin-kubeconfig-csr.json
    - apiserver-etcd-client-csr.json
    - apiserver-kubelet-client-csr.json
    - cluster-ca-csr.json
    - controller-manager-csr.json
    - etcd-ca-csr.json
    - etcd-healthcheck-client-csr.json
    - etcd-peer-csr.json
    - etcd-server-csr.json
    - front-proxy-ca-csr.json
    - front-proxy-client-csr.json
    - kube-proxy-csr.json
    - kubelet-kubeconfig-csr.json
    - scheduler-csr.json

- name: generate cert files
  template:
    src: '{{ item.src }}'
    dest: '{{ item.dest }}'
    owner: sysop
    mode: "u=rw,g=r,o=r"
  with_items:
    - { src: 'apiserver-csr.json.j2',dest: '{{ cert_config }}/apiserver-csr.json'}
    - { src: 'sign-policy.json.j2',dest: '{{ cert_config }}/sign-policy.json'}
    - { src: 'cluster-ca-policy.json.j2',dest: '{{ cert_config }}/cluster-ca-policy.json'}

