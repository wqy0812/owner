---

- name: copy yaml addon files for management cluster
  copy:
    src: yaml-addon/
    dest: /etc/openFuyao/addons/manifests/kubernetes/
    owner: sysop
    group: users
    mode: "u=rw,g=r,o=r"
  delegate_to: "{{ item }}"
  run_once: true
  loop: "{{ groups['bootstrap_host'] }}"
  when:
    - "'management_cluster_k8smaster' in group_names"

- name: copy yaml addon files for work cluster
  copy:
    src: yaml-addon/
    dest: /etc/openFuyao/addons/manifests/kubernetes/
    owner: sysop
    group: users
    mode: "u=rw,g=r,o=r"
  delegate_to: "{{ item }}"
  run_once: true
  loop: "{{ groups['management_cluster_k8smaster'] }}"    
  when:
    - "'work_cluster_k8smaster' in group_names"

