---

- name: set global facts
  set_fact:
    SSH_KNOWN_HOSTS: "{{ SSH_KNOWN_HOSTS | default('~/.ssh/known_hosts') }}"
    SSH_KEY_PUB:  "{{ SSH_KEY_PUB | default('~/.ssh/ansible_key.pub') }}"

- name: absent from known_hosts
  lineinfile:
    path: "{{ SSH_KNOWN_HOSTS }}"
    line: "^{{ inventory_hostname }}"
    state: absent
  ignore_errors: yes

- name: init authorized_key
  authorized_key:
    user: sysop
    key: "{{ lookup('file', '{{ SSH_KEY_PUB }}') }}"
    manage_dir: yes
