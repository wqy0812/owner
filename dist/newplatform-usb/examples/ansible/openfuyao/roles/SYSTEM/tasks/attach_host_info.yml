---

- name: Add all hosts with custom variables
  add_host:
    name: "{{ hostvars[item].inventory_hostname }}"
    custom_hostname: "{{ hostvars[item].ansible_hostname }}"
  loop: "{{ ansible_play_hosts }}"
  run_once: true
  when: hostvars[item].ansible_hostname | length > 0

- name: Display host information
  debug:
    msg: "Host IP: {{ inventory_hostname }}, Hostname: {{ hostvars[inventory_hostname].custom_hostname }}"
