---

- name: create /approot1/paas/log/kubelet.log
  shell: "mkdir -p /approot1/paas/log && touch /approot1/paas/log/kubelet.log /approot1/paas/log/containerd.log && chmod 600 /approot1/paas/log/kubelet.log /approot1/paas/log/containerd.log"

- name: upload  kubelet.conf file
  copy: src=kubelet.conf dest=/etc/rsyslog.d/kubelet.conf owner=sysop group=root mode="u=rw,g=r,o=r"

- name: upload  containerd.conf file
  copy: src=containerd.conf dest=/etc/rsyslog.d/containerd.conf owner=sysop group=root mode="u=rw,g=r,o=r"


# 增加日志滚动压缩
- name: upload logrotate conf of syslog
  copy: src=k8slog dest=/etc/logrotate.d/k8slog owner=root group=root mode="u=rw,g=r,o=r" backup=yes

- name: systemctl daemon-reload
  command: systemctl daemon-reload

- name: restart rsyslog
  service: name=rsyslog state=restarted