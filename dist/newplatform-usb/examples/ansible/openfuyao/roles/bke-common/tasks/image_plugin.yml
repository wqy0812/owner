---
- name: configure the harbor account password and pass the image-credential-provider script to ManagementCluster and WorkClusterMaster
  include_tasks: image-plugin/ManagementAndWorkMaster.yml
  when:
    - "'management_cluster_k8smaster' in group_names or 'work_cluster_k8smaster' in group_names"

- name: configure the harbor account password and pass the image-credential-provider script to WorkClusterNode
  include_tasks: image-plugin/WorkClusterNode.yml
  when:
    - "'work_cluster_k8snode' in group_names"