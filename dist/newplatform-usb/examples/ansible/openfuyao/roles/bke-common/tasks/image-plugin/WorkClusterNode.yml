---
- name: Ensure credential providers directory exists
  file:
    path: /usr/local/bin/kubelet-credential-providers
    state: directory
    mode: "0500"


- name: Ensure credential providers yaml directory exists
  file:
    path: /etc/icbc
    state: directory
    mode: "0500"


- name: Copy docker-credential-fyhub
  copy:
    src: docker-credential-fyhub
    dest: /usr/local/bin/kubelet-credential-providers/docker-credential-fyhub
    mode: "0500"


- name: Copy image-credential-provider.yaml
  copy:
    src: image-credential-provider-node.yaml
    dest: /etc/icbc/image-credential-provider.yaml
    mode: "0400"