---

- name: set global facts
  set_fact:
    timestamp_seconds: "{{ ansible_date_time.epoch }}"

- name: exec manager builder
  block:

    - name: gen build yaml
      template:
        src: '{{ item.src }}'
        dest: '/tmp/{{ item.dest }}'
        owner: sysop
        mode: "u=rwx,g=rx,o=rx"
      with_items:
        - { src: 'bn.yaml.j2', dest: 'bn_{{ timestamp_seconds }}.yaml'}

    - name: add nodes
      shell: |
        set -ex
        # 设置总超时时间（秒），默认300s,超过20台，增加一台多60秒
        TOTAL_TIMEOUT="{{ (300 + ((nodes_length | int - 20) * 60 if nodes_length | int > 20 else 0)) }}"
        # 定义日志文件路径
        LOG_FILE="/var/log/bke_init.log"         
        # 记录开始时间
        START_TIME=$(date +%s)
        # 定义命令列表
        file="/tmp/bn_{{ timestamp_seconds }}.yaml"
        SCRIPTS=(
          "kubectl apply -f $file"
          "kubectl wait --for=jsonpath='{.status.clusterStatus}'=Ready bc/{{ cluster_id_lower }} -n bke-{{ cluster_id_lower }} --timeout=1800s"
          "rm -f $file"
        )
        # 执行每个脚本
        for script in "${SCRIPTS[@]}"; do
          # 检查是否已超时
          CURRENT_TIME=$(date +%s)
          ELAPSED=$((CURRENT_TIME - START_TIME))
          REMAINING=$((TOTAL_TIMEOUT - ELAPSED))
        
          if [ $REMAINING -le 0 ]; then
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] 总执行时间已超过 ${TOTAL_TIMEOUT} 秒，终止执行" >> "$LOG_FILE"
            exit 1
          fi
        
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] 正在执行 $script (剩余时间: ${REMAINING}秒)" >> "$LOG_FILE"
        
          # 执行脚本，传递剩余时间作为超时
          if ! timeout "$REMAINING" bash -c "$script" >> "$LOG_FILE" 2>&1; then
            exit_code=$?
            if [[ $exit_code -eq 124 ]]; then
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] $script 执行超时" >> "$LOG_FILE"
            else
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] $script 执行失败，错误码：$exit_code" >> "$LOG_FILE"
            fi
            exit 1
          fi
        done
        set +ex
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] 所有脚本执行完成" >> "$LOG_FILE"

      async: "{{ (300 + ((nodes_length | int - 20) * 60 if nodes_length | int > 20 else 0)) }}"
      poll: 0    # 不轮询状态
      register: script_result

    - name: check tasks is complete
      async_status:
        jid: "{{ script_result.ansible_job_id }}"
      register: job_result
      until: job_result.finished
      retries: "{{ ( (300 + ((nodes_length | int - 20) * 60 if nodes_length | int > 20 else 0)) // 10 ) }}"
      delay: 10
      ignore_errors: yes  # 纳管失败的校验放在后面

    - name: Check if the work cluster bc is complete
      command: kubectl wait --for=jsonpath='{.status.clusterStatus}'=Ready bc/{{ cluster_id_lower }} -n bke-{{ cluster_id_lower }} --timeout="{{ (300 + ((nodes_length | int - 20) * 60 if nodes_length | int > 20 else 0)) }}"s
      register: cluster_complete
      failed_when: cluster_complete.rc != 0
      ignore_errors: yes  # 纳管失败的校验放在后面

  delegate_to: "{{ groups['management_cluster_k8smaster'][0] }}"
  run_once: true

# 校验每台宿主机情况
- name: check each nodes status
  block:

    # 第一步：确认宿主机node已经存在
    - name: Poll node status until the node is found
      shell: kubectl get node {{ inventory_hostname }} --no-headers
      register: node_status
      until:
        - node_status.rc == 0
      retries: "{{ ( (300 + ((nodes_length | int - 20) * 60 if nodes_length | int > 20 else 0)) // 10 ) }}"
      delay: 10

    # 第二步：校验宿主机node状态已经Ready
    - name: check each nodes status
      shell: kubectl wait --for=condition=Ready "node/{{ inventory_hostname }}" --timeout=300s

  delegate_to: "{{ groups['work_cluster_k8smaster'][0] }}"


