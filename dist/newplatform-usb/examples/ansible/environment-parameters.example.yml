---
# Safe grouped Environment contract for the platform-owned OpenFuyao adapters.
# Values are TEST-NET/placeholders. Credentials are references, never inline values.

facts:
  operating_system: kylin-v10
  architecture: amd64
  ip_family: ipv4

inventory:
  ansible_user: demo-operator
  groups:
    bootstrap_host: []
    management_cluster_k8smaster: []
    work_cluster_k8smaster: []
    work_cluster_k8snode: []

operation:
  management_cluster_id: demo-management-cluster
  work_cluster_id: demo-work-cluster
  strategy: StatelessFlatNetworkStrategy

artifact_sources:
  registry:
    domain: registry.example.invalid
    ip: 192.0.2.10
    port: 443
    project: openfuyao
  chart_repository:
    url: https://charts.example.invalid
    port: 443
    name: openfuyao
  file_station:
    domain: files.example.invalid
    ip: 192.0.2.20
    port: 443
    prefix: /file-station
    url: https://files.example.invalid/file-station
  binaries:
    bke_admin: bke-admin
    jq: jq
    bootstrap_image: bootstrap-image

ssh:
  public_key: /path/to/demo-only/id_ed25519.pub
  known_hosts: /path/to/demo-only/known_hosts

monitoring:
  amc_address: 192.0.2.30
  amc_port: 58080

network:
  service_ipv4_cidr: 10.96.0.0/12
  pod_ipv4_cidr: 192.168.0.0/16
  pod_ipv6_cidr: fd00:10:244::/56
  cluster_dns_service_ip: 10.96.0.10
  kubernetes_service_ip: 10.96.0.1
  host_port_min: 30000
  host_port_max: 32767
  local_port_range: "1024 65535"

versions:
  openfuyao: v25.12
  kubernetes: v1.34.3-of.1
  etcd: v3.6.7-of.1
  containerd: v2.1.1
  calico: v3.27.3-icbc
  coredns: v1.12.2-of.1
  kube_proxy: v1.34.3-of.1.icbc.harbor
  openstack_vlan: v0.0.2
  redis_operator: v1.0.0
  harbor_secret_version: v1.0.0
  pause: placeholder
  cluster_api: 1.0.5
  bkeagent_deployer: source-6909da3
  bkeagent_deployer_tag: source-6909da3
  ip_mod: source-6909da3

certificates:
  output_path: /tmp/newplatform-demo-certs
  output_file: cluster-certs.tar.gz
  config_path: /etc/openFuyao/certs/cert_config
  expiry: 8760h

addon_params:
  amc: {}
  clusterconfig: {}
  clustermonitor: {}
  monitcontrollermanager: {}
  housekeeping: {}
  openstack-vlan: {}

credential_refs:
  ansible_ssh_pass:
    envVarRef: NEWPLATFORM_OPENFUYAO_SSH_PASSWORD
  ENV_DOCKER_SECRET_USERNAME:
    envVarRef: NEWPLATFORM_OPENFUYAO_REGISTRY_USERNAME
  ENV_DOCKER_SECRET_PASSWORD:
    envVarRef: NEWPLATFORM_OPENFUYAO_REGISTRY_PASSWORD
  ENV_CHART_PULL_USERNAME:
    envVarRef: NEWPLATFORM_OPENFUYAO_CHART_USERNAME
  ENV_CHART_PULL_PASSWORD:
    envVarRef: NEWPLATFORM_OPENFUYAO_CHART_PASSWORD

# cluster_role and target_host_group are fixed by each scenario node. Callback
# URL/token, task ID, and the legacy management_cluster_id wrapper variable are
# not Release parameters because the platform does not invoke ansible_run.sh.
