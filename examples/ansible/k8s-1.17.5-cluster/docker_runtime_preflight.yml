---
- name: Read the environment-provisioned Docker runtime version
  command: /usr/bin/docker version --format '{{ "{{" }} .Server.Version {{ "}}" }}'
  register: k8s1175_docker_version
  changed_when: false
  tags:
    - always

- name: Validate the environment-provisioned Docker runtime
  assert:
    that:
      - K8S1175_DOCKER_RUNTIME_VERIFIED | default(false) | bool
      - (k8s1175_docker_version.stdout | default('')) == (K8S1175_DOCKER_VERSION | string)
    fail_msg: >-
      Docker must be installed and independently verified by the environment
      owner before this cluster job runs, and its server version must match
      K8S1175_DOCKER_VERSION exactly.
  tags:
    - always
