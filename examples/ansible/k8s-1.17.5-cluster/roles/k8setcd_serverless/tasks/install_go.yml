---


- name: download {{ GO_PPROF_PATH }} with SHA256 verification
  tags:
    - install
    - check
    - update
  get_url:
    url: http://{{ IHS_IP }}:{{ IHS_PORT }}/{{ GO_PPROF_PATH }}
    dest: /var/tmp/go-pprof-k8s1175.tar.gz
    checksum: sha256:{{ GO_PPROF_SHA256 }}
    mode: '0600'

- name: unarchive verified Go and pprof toolkit
  tags:
    - install
    - check
    - update
  unarchive:
    src: /var/tmp/go-pprof-k8s1175.tar.gz
    dest: /usr/local
    remote_src: true
    owner: sysop
- name: change permission of pprof
  tags:
    - install
    - check
    - update
  shell: "chmod +x /usr/local/go/pkg/tool/linux_amd64/pprof"
- name: change permission of go
  tags:
    - install
    - check
    - update
  shell: "chmod +x /usr/local/bin/go"
