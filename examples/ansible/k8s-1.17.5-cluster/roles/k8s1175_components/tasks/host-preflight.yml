---
- name: Validate SUSE AMD64 host facts
  ansible.builtin.assert:
    that:
      - ansible_architecture == 'x86_64'
      - ansible_os_family == 'Suse'
    fail_msg: Kubernetes 1.17.5 snapshot supports SUSE AMD64 only.

- name: Validate the required environment topology
  ansible.builtin.assert:
    that:
      - groups['k8s_cert_controller'] | default([]) | length == 1
      - groups['k8setcd'] | default([]) | length >= 1
      - groups['k8smaster'] | default([]) | length >= 1
      - groups['k8snode'] | default([]) | length >= 1

