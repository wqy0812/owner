---

- name: init authorized_key
  tags:
    - install
    - check
    - update
  authorized_key:
    user: sysop
    key: "{{ lookup('file', '~/.ssh/ansible_key.pub') }}"
    manage_dir: yes

# - include: stop_k8snode.yml
  #tags: stop_k8snode
- import_tasks: install_docker.yml
  tags: ins_docker
- import_tasks: init_k8snode_kubconfig.yml
  tags: init_k8snode_kubconfig
  delegate_to: "{{ groups['k8smaster'][0] }}"
- import_tasks: install_k8snode.yml
  tags: ins_k8snode
#- include: install_flannel.yml
#  tags: ins_flannel
- import_tasks: restart_k8snode.yml
  tags: res_k8snode
