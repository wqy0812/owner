---
- name: Install kube-scheduler service unit
  ansible.builtin.copy:
    src: kube-scheduler.service
    dest: /usr/lib/systemd/system/kube-scheduler.service
    owner: root
    group: users
    mode: '0644'
    backup: true

- name: Generate kube-scheduler kubeconfig
  ansible.builtin.template:
    src: init-kube-scheduler.sh.j2
    dest: /approot1/paas/kube/bin/init-kube-scheduler.sh
    owner: kube
    group: users
    mode: '0755'

- name: Initialize kube-scheduler kubeconfig
  ansible.builtin.command: /approot1/paas/kube/bin/init-kube-scheduler.sh
  changed_when: true

- name: Write kube-scheduler parameters
  ansible.builtin.copy:
    src: scheduler
    dest: /approot1/paas/kube/conf/scheduler
    owner: kube
    group: users
    mode: '0644'

- name: Enable and start kube-scheduler
  ansible.builtin.systemd:
    name: kube-scheduler
    enabled: true
    state: started
    daemon_reload: true

