---
# These tasks are responsible for copying the latest dev/production code from
# the version control system.

- name: wait for k8smaster starting
  tags:
    - install
    - update
    - check
  wait_for: timeout=30
  
- name: create clusterrolebinding kubelet-bootstrap
  tags:
    - install
    - update
    - check
  shell: "/approot1/paas/kube/bin/kubectl create clusterrolebinding kubelet-bootstrap --clusterrole=system:node-bootstrapper --group=system:bootstrappers --kubeconfig=/approot1/paas/kube/cert/kubectl.kubeconfig"
  register: r
  failed_when: "r.stderr and 'already exists' not in r.stderr"
  
- name: copy csr-crb.yaml
  tags:
    - install
    - update
    - check
  copy: src=csr-crb.yaml dest=/approot1/paas/kube/conf/csr-crb.yaml owner=kube mode="u=rwx,g=rx,o=rx"
  
- name: create clusterrolebinding kubelet-bootstrap
  tags:
    - install
    - update
    - check
  shell: "/approot1/paas/kube/bin/kubectl apply -f /approot1/paas/kube/conf/csr-crb.yaml --kubeconfig=/approot1/paas/kube/cert/kubectl.kubeconfig"

- name: <autoscale-cluster-authorize>upload cluster role yml
  tags:
    - install
    - update
    - check
  template: src=autoscale-role.yaml.j2 dest=/home/sysop/autoscale-role.yaml owner=root group=users mode="u=rwx,g=rx,o=rx"
  ignore_errors: True

- name: <autoscale-cluster-authorize>create ns
  tags:
    - install
    - update
    - check
  shell: "kubectl create ns f-paas-subruntime "
  ignore_errors: True

- name: <autoscale-cluster-authorize>create clusterrole and clusterrolebinding k8s objects
  tags:
    - install
    - update
    - check
  shell: kubectl apply -f /home/sysop/autoscale-role.yaml
  ignore_errors: True

- name: <cluster-authorize>upload prom cluster role yml
  tags:
    - install
    - update
    - check
  template: src=prometheus-rbac.yaml.j2 dest=/home/sysop/prometheus-rbac.yaml owner=root group=users mode="u=rwx,g=rx,o=rx"

- name: <cluster-authorize>create prometheus clusterrole and clusterrolebinding k8s objects
  tags:
    - install
    - update
    - check
  shell: kubectl apply -f /home/sysop/prometheus-rbac.yaml
  ignore_errors: True

- name: <k8smaster>get  SECRET_NAME via  kubectl
  tags:
    - install
    - update
    - check
  shell: |
    kubectl -n kube-system get sa prometheus-sa -o jsonpath='{.secrets[0].name}'
  register: secret_result
  changed_when: false
  no_log: true

- set_fact:
    SECRET_NAME: "{{ secret_result.stdout }}"
  no_log: true
  tags:
    - install
    - update
    - check

- name: <k8smaster>get token via  kubectl
  shell: |
    kubectl -n kube-system get secret "{{ SECRET_NAME }}" -o jsonpath='{.data.token}' | base64 -d
  register: token_result
  changed_when: false
  no_log: true
  tags:
    - install
    - update
    - check

- set_fact:
    TOKEN: "{{ token_result.stdout }}"
  no_log: true
  tags:
    - install
    - update
    - check

- name: initialize prometheus kubeconfig without retaining the token script
  block:
    - name: <k8smaster>upload prometheus's kubeconfig script
      template: src=init-prometheus.sh.j2 dest=/approot1/paas/kube/bin/init-prometheus.sh owner=kube group=users mode="u=rwx,g=,o="

    - name: <k8smaster>init prometheus's kubeconfig script
      shell: "sh /approot1/paas/kube/bin/init-prometheus.sh"
  always:
    - name: remove token-bearing prometheus kubeconfig script
      file:
        path: /approot1/paas/kube/bin/init-prometheus.sh
        state: absent
  no_log: true
  tags:
    - install
    - update
    - check

- name: admin fetch prometheus's kubeconfig from master
  tags:
    - install
    - check
    - update
  fetch:
    src: /approot1/paas/kube/cert/prometheus.kubeconfig
    dest: /approot1/paas/admin/app/ansible/task/cert/{{ CLUSTER_ID }}/
    flat: yes

- name: restrict fetched prometheus kubeconfig on controller
  tags:
    - install
    - check
    - update
  file:
    path: /approot1/paas/admin/app/ansible/task/cert/{{ CLUSTER_ID }}/prometheus.kubeconfig
    state: file
    owner: "{{ ANSIBLE_USER }}"
    mode: "u=rw,g=,o="
  delegate_to: localhost
  no_log: true
