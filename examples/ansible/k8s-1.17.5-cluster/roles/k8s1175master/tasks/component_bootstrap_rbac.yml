---
- name: Generate administrative kubectl kubeconfig
  ansible.builtin.template:
    src: init-kubectl.sh.j2
    dest: /approot1/paas/kube/bin/init-kubectl.sh
    owner: kube
    group: users
    mode: '0750'
  no_log: true

- name: Initialize administrative kubectl kubeconfig
  ansible.builtin.command: /approot1/paas/kube/bin/init-kubectl.sh
  changed_when: true
  no_log: true

- name: Generate kube-proxy kubeconfig
  ansible.builtin.template:
    src: init-kube-proxy.sh.j2
    dest: /approot1/paas/kube/bin/init-kube-proxy.sh
    owner: kube
    group: users
    mode: '0750'
  no_log: true

- name: Initialize kube-proxy kubeconfig
  ansible.builtin.command: /approot1/paas/kube/bin/init-kube-proxy.sh
  changed_when: true
  no_log: true

- name: Configure kubelet bootstrap ClusterRoleBinding
  ansible.builtin.command:
    argv:
      - /approot1/paas/kube/bin/kubectl
      - --kubeconfig=/approot1/paas/kube/cert/kubectl.kubeconfig
      - create
      - clusterrolebinding
      - kubelet-bootstrap
      - --clusterrole=system:node-bootstrapper
      - --group=system:bootstrappers
  register: k8s1175_bootstrap_rbac
  changed_when: k8s1175_bootstrap_rbac.rc == 0
  failed_when: k8s1175_bootstrap_rbac.rc != 0 and 'already exists' not in k8s1175_bootstrap_rbac.stderr

- name: Apply CSR approval RBAC
  ansible.builtin.copy:
    src: csr-crb.yaml
    dest: /approot1/paas/kube/conf/csr-crb.yaml
    owner: kube
    group: users
    mode: '0644'

- name: Commit CSR approval RBAC
  ansible.builtin.command:
    argv:
      - /approot1/paas/kube/bin/kubectl
      - --kubeconfig=/approot1/paas/kube/cert/kubectl.kubeconfig
      - apply
      - -f
      - /approot1/paas/kube/conf/csr-crb.yaml
  changed_when: true

- name: Render one kubelet bootstrap script per target node
  ansible.builtin.template:
    src: bootstrap-kubeconfig.sh.j2
    dest: "/approot1/paas/kube/bin/bootstrap-kubeconfig-{{ item }}.sh"
    owner: kube
    group: users
    mode: '0750'
  vars:
    k8s1175_bootstrap_node: "{{ item }}"
  loop: "{{ (groups['k8smaster'] | default([])) + (groups['k8snode'] | default([])) }}"
  no_log: true

- name: Generate one scoped kubelet bootstrap kubeconfig per target node
  ansible.builtin.command: "/approot1/paas/kube/bin/bootstrap-kubeconfig-{{ item }}.sh"
  loop: "{{ (groups['k8smaster'] | default([])) + (groups['k8snode'] | default([])) }}"
  changed_when: true
  no_log: true
