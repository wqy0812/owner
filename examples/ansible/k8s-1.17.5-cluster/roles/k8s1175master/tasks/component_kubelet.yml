---
- name: Install this master's scoped kubelet bootstrap kubeconfig
  ansible.builtin.copy:
    src: "/approot1/paas/kube/cert/kubelet-bootstrap-{{ inventory_hostname }}.kubeconfig"
    dest: /approot1/paas/kube/cert/kubelet-bootstrap.kubeconfig
    remote_src: true
    owner: kube
    group: users
    mode: '0600'
  no_log: true

- name: Install kubelet service unit
  ansible.builtin.copy:
    src: kubelet.service
    dest: /usr/lib/systemd/system/kubelet.service
    owner: root
    group: users
    mode: '0644'
    backup: true

- name: Write kubelet parameters
  ansible.builtin.template:
    src: kubelet.j2
    dest: /approot1/paas/kube/conf/kubelet
    owner: kube
    group: users
    mode: '0644'

- name: Enable and start kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
    state: started
    daemon_reload: true
