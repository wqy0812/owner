---
- name: Upgrade demo node agent from 1.0.0 to 1.1.0
  hosts: demo_nodes
  gather_facts: false
  vars:
    agent_root: /tmp/newplatform-demo-agent
    from_version: 1.0.0
    to_version: 1.1.0
  tasks:
    - name: Read installed version
      ansible.builtin.slurp:
        src: "{{ agent_root }}/VERSION"
      register: installed_version

    - name: Require the declared upgrade edge
      ansible.builtin.assert:
        that:
          - (installed_version.content | b64decode | trim) == from_version
        fail_msg: >-
          Upgrade requires {{ from_version }}, found
          {{ installed_version.content | b64decode | trim }}

    - name: Save rollback checkpoint
      ansible.builtin.copy:
        dest: "{{ agent_root }}/.previous-version"
        content: "{{ installed_version.content | b64decode | trim }}\n"
        mode: "0600"

    - name: Write upgraded version
      ansible.builtin.copy:
        dest: "{{ agent_root }}/VERSION"
        content: "{{ to_version }}\n"
        mode: "0600"
