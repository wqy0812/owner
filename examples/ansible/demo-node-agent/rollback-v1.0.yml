---
- name: Roll back demo node agent to its checkpoint
  hosts: demo_nodes
  gather_facts: false
  vars:
    agent_root: /tmp/newplatform-demo-agent
    rollback_version: 1.0.0
  tasks:
    - name: Read rollback checkpoint
      ansible.builtin.slurp:
        src: "{{ agent_root }}/.previous-version"
      register: previous_version

    - name: Validate rollback edge
      ansible.builtin.assert:
        that:
          - (previous_version.content | b64decode | trim) == rollback_version
        fail_msg: >-
          Checkpoint does not contain rollback target {{ rollback_version }}

    - name: Restore checkpointed version
      ansible.builtin.copy:
        dest: "{{ agent_root }}/VERSION"
        content: "{{ previous_version.content | b64decode | trim }}\n"
        mode: "0600"

    - name: Consume rollback checkpoint
      ansible.builtin.file:
        path: "{{ agent_root }}/.previous-version"
        state: absent
