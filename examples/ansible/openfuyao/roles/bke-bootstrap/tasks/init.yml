---

- import_tasks: roles/SYSTEM/tasks/gather_facts.yml

- import_tasks: roles/SYSTEM/tasks/authorized_key.yml

- import_tasks: roles/bke-common/tasks/bke_install.yml

- import_tasks: roles/SYSTEM/tasks/kill_service.yml
  vars:
    service_name: "ds_agent.service"

- name: set global facts
  set_fact:
    cluster_id_lower: '{{ cluster_id | lower }}'
    default_workspace: '/bke/cluster'


