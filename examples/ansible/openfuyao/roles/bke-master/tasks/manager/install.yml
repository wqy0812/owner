---
# 管理集群搭建，超时时间严控为35分钟

- name: exec manager builder
  block:

    - name: gen build yaml
      template:
        src: '{{ item.src }}'
        dest: '/tmp/{{ item.dest }}'
        owner: sysop
        mode: "u=rwx,g=rx,o=rx"
      with_items:
        - { src: 'cct.yaml.j2', dest: 'cct-{{ cluster_id_lower }}.yaml'}
        - { src: 'kct.yaml.j2', dest: 'kct-{{ cluster_id_lower }}.yaml'}
        - { src: 'bn.yaml.j2', dest: 'bn-{{ cluster_id_lower }}.yaml'}
        - { src: 'bc-manager.yaml.j2', dest: 'bc-manager-{{ cluster_id_lower }}.yaml'}

    - name: build cluster
      shell: |
        set -ex
        # 设置总超时时间（控制30分钟）
        TOTAL_TIMEOUT=1800
        # 定义日志文件路径
        LOG_FILE="/var/log/bke_init.log"
        # 记录开始时间
        START_TIME=$(date +%s)
        
        # 要执行的命令列表
        SCRIPTS=(
          "kubectl apply -f /tmp/cct-{{ cluster_id_lower }}.yaml"
          "kubectl apply -f /tmp/kct-{{ cluster_id_lower }}.yaml"
          "bke cluster create -f /tmp/bc-manager-{{ cluster_id_lower }}.yaml -n /tmp/bn-{{ cluster_id_lower }}.yaml"
          "rm -f /tmp/cct-{{ cluster_id_lower }}.yaml /tmp/kct-{{ cluster_id_lower }}.yaml /tmp/bc-manager-{{ cluster_id_lower }}.yaml /tmp/bn-{{ cluster_id_lower }}.yaml"
         )
        
        # 执行每个脚本
        for script in "${SCRIPTS[@]}"; do
          # 检查是否已超时
          CURRENT_TIME=$(date +%s)
          ELAPSED=$((CURRENT_TIME - START_TIME))
          REMAINING=$((TOTAL_TIMEOUT - ELAPSED))
          
          if [ $REMAINING -le 0 ]; then
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] 总执行时间已超过 ${TOTAL_TIMEOUT} 秒，终止执行" >> "$LOG_FILE"
            exit 1
          fi
          
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] 正在执行 $script (剩余时间: ${REMAINING}秒)" >> "$LOG_FILE"
          
          # 执行脚本，传递剩余时间作为超时
          if ! timeout $REMAINING bash -c "$script" >> "$LOG_FILE" 2>&1; then
            echo "$script 执行失败或超时" >> "$LOG_FILE"
            if pgrep -f "bke cluster create -f /tmp/bc-manager-{{ cluster_id_lower }}.yaml -n bn-{{ cluster_id_lower }}.yaml" > /dev/null; then        
              pkill -f "bke cluster create -f /tmp/bc-manager-{{ cluster_id_lower }}.yaml -n bn-{{ cluster_id_lower }}.yaml" >> "$LOG_FILE"
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] bke cluster create 进程已手动杀死" >> "$LOG_FILE"
            fi
            exit 1
          fi
        done
        set +ex
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] 所有脚本执行完成" >> "$LOG_FILE"
      async: "1800"
      poll: 0    # 不轮询状态
      register: script_result

    - name: check tasks is complete
      async_status:
        jid: "{{ script_result.ansible_job_id }}"
      register: job_result
      until: job_result.finished
      retries: "181"
      delay: 10

  delegate_to: "{{ groups['bootstrap_host'][0] }}"
  run_once: true

- include_tasks: roles/bke-cert/tasks/fetch.yml
  run_once: true

- include_tasks: roles/bke-addon/tasks/install.yml

- name: Check if the manager cluster build is complete
  command: kubectl wait --for=jsonpath='{.status.clusterHealthState}'=Healthy bc/bke-cluster -n bke-cluster --timeout=300s
  register: cluster_complete
  run_once: true
  failed_when: cluster_complete.rc != 0