---

- name: Check if kubectl exists
  command: which kubectl
  register: kubectl_exists
  delegate_to: "{{ groups['management_cluster_k8smaster'][0] }}"
  run_once: true
  ignore_errors: yes

- name: Run sub-tasks if kubectl exists
  block:
    - name: check work cluster
      shell: |
        kubectl get bc  -A -o jsonpath='{.items[*].metadata.name}' \
          |grep -vw '{{ cluster_id_lower }}'
      ignore_errors: yes
      register: cluster_list

    - name: check bn num
      shell: kubectl get nodes --no-headers | wc -l
      ignore_errors: yes
      register: bn_num
      when:
        - cluster_list is defined and cluster_list.stdout | length > 0

    # 删除每个bn的超时时间为5分钟
    - name: delete work cluster bn
      shell: |
        kubectl get bn -n 'bke-{{ cluster_id_lower }}' -o jsonpath='{.items[*].metadata.name}' | xargs -d ' ' -I {} \
          kubectl delete bn -n 'bke-{{ cluster_id_lower }}' {} --wait 300s
      when:
        - bn_num is defined
        - "'stdout' in bn_num"
        - bn_num.stdout | length > 0
        - bn_num.stdout | int > 0

    # bc删除超时时间默认30分钟，每增加一台Node节点增加5分钟
    - name: delete work cluster bc
      shell: |
        kubectl get bc -n 'bke-{{ cluster_id_lower }}' -o jsonpath='{.items[*].metadata.name}' | xargs -d ' ' -I {} \
          kubectl delete bc -n 'bke-{{ cluster_id_lower  }}' {} --wait {{ ((bn_num.stdout | int) + 6) * 300 }}s
      when:
        - bn_num is defined
        - "'stdout' in bn_num"
        - bn_num.stdout | length > 0
        - bn_num.stdout | int > 0

  delegate_to: "{{ groups['management_cluster_k8smaster'][ 0 ] }}"
  run_once: true
  when: kubectl_exists.rc == 0

- import_tasks: roles/bke-common/tasks/bke_reset.yml
