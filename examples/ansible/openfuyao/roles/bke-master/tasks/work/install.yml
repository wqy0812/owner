---
# 管理集群搭建，超时时间严控为35分钟

- name: exec manager builder
  block:

    - name: gen build yaml
      template:
        src: '{{ item.src }}'
        dest: '/tmp/{{ item.dest }}'
        owner: sysop
        mode: "u=rwx,g=rx,o=rx"
      with_items:
        - { src: 'cct.yaml.j2', dest: 'cct-{{ cluster_id_lower }}.yaml'}
        - { src: '{{ strategy }}/kct.yaml.j2', dest: 'kct-{{ cluster_id_lower }}.yaml'}
        - { src: 'bn.yaml.j2', dest: 'bn-{{ cluster_id_lower }}.yaml'}
        - { src: '{{ strategy }}/bc-work.yaml.j2', dest: 'bc-work-{{ cluster_id_lower }}.yaml'}

    - name: build cluster
      shell: |
        set -ex
        # 设置总超时时间（控制30分钟）
        TOTAL_TIMEOUT=1800
        # 定义日志文件路径
        LOG_FILE="/var/log/bke_init.log"        
        # 记录开始时间
        START_TIME=$(date +%s)
        
        # 要执行的命令列表
        SCRIPTS=(
          "kubectl apply -f /tmp/cct-{{ cluster_id_lower }}.yaml"
          "kubectl apply -f /tmp/kct-{{ cluster_id_lower }}.yaml"
          "bke cluster create -f /tmp/bc-work-{{ cluster_id_lower }}.yaml -n /tmp/bn-{{ cluster_id_lower }}.yaml"
          "rm -f /tmp/cct-{{ cluster_id_lower }}.yaml /tmp/kct-{{ cluster_id_lower }}.yaml /tmp/bc-work-{{ cluster_id_lower }}.yaml /tmp/bn-{{ cluster_id_lower }}.yaml"
         )
        
        # 执行每个脚本
        for script in "${SCRIPTS[@]}"; do
          # 检查是否已超时
          CURRENT_TIME=$(date +%s)
          ELAPSED=$((CURRENT_TIME - START_TIME))
          REMAINING=$((TOTAL_TIMEOUT - ELAPSED))
        
          if [ $REMAINING -le 0 ]; then
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] 总执行时间已超过 ${TOTAL_TIMEOUT} 秒，终止执行" >> "$LOG_FILE"
            exit 1
          fi
        
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] 正在执行 $script (剩余时间: ${REMAINING}秒)" >> "$LOG_FILE"
        
          # 执行脚本，传递剩余时间作为超时
          if ! timeout $REMAINING bash -c "$script" >> "$LOG_FILE" 2>&1; then
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] $script 执行失败或超时" >> "$LOG_FILE"
            if pgrep -f "bke cluster create -f /tmp/bc-work-{{ cluster_id_lower }}.yaml -n bn-{{ cluster_id_lower }}.yaml" > /dev/null; then        
              pkill -f "bke cluster create -f /tmp/bc-work-{{ cluster_id_lower }}.yaml -n bn-{{ cluster_id_lower }}.yaml" >> "$LOG_FILE"
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] bke cluster create 进程已手动杀死" >> "$LOG_FILE"
            fi
            exit 1
          fi
        done
        set +ex
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] 所有脚本执行完成" >> "$LOG_FILE"
      async: "1800"
      poll: 0    # 不轮询状态
      register: script_result

    - name: check tasks is complete
      async_status:
        jid: "{{ script_result.ansible_job_id }}"
      register: job_result
      until: job_result.finished
      retries: "181"
      delay: 10

    - name:  Check if the work cluster build is complete
      command: kubectl wait --for=jsonpath='{.status.clusterStatus}'=Ready bc/{{ cluster_id_lower }} -n bke-{{ cluster_id_lower }} --timeout=300s
      register: cluster_complete
      failed_when: cluster_complete.rc != 0

  delegate_to: "{{ groups['management_cluster_k8smaster'][0] }}"
  run_once: true

- include_tasks: roles/bke-cert/tasks/fetch.yml
  run_once: true

- include_tasks: roles/bke-addon/tasks/install.yml

- name: taint master
  shell: |
    # 定义日志文件路径
    LOG_FILE="/var/log/bke_init.log"    
    # 设置污点
    kubectl taint nodes {{ inventory_hostname }} node-role.kubernetes.io/control-plane:NoSchedule --overwrite=true >> "$LOG_FILE"
    
    # 等待污点生效（超时 30 秒）
    end=$(( $(date +%s) + 30 ))
    while [ $(date +%s) -lt "$end" ]; do
      if kubectl get node {{ inventory_hostname }} -o json | jq -e '.spec.taints[] | select(.key=="node-role.kubernetes.io/control-plane")' &>/dev/null; then
        echo "Taint applied successfully." >> "$LOG_FILE"
        exit 0
      fi
      sleep 1
    done
    echo "Timeout: Taint not applied within 30 seconds." >> "$LOG_FILE"
    exit 1